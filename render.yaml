services:
  - type: web
    name: sourcewise
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/sourcewise.db
      - key: CORS_ORIGINS
        value: https://sourcewise.onrender.com
      - key: OPENAI_API_KEY
        sync: false
